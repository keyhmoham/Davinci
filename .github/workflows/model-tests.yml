name: Davinci model tests

on:
  push:
    paths:
      - "src/davinci/**"
      - "notebooks/**"
      - "tests/test_model.py"
      - "tests/test_train.py"
      - "tests/test_long_context.py"
      - "tests/test_hierarchical_retrieval.py"
      - "tests/test_notebook_integrity.py"
      - ".github/workflows/model-tests.yml"
  pull_request:
    paths:
      - "src/davinci/**"
      - "tests/test_model.py"
      - "tests/test_train.py"
      - "tests/test_long_context.py"
      - "tests/test_hierarchical_retrieval.py"
      - "tests/test_notebook_integrity.py"
      - ".github/workflows/model-tests.yml"

jobs:
  model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pytest
      - name: Run decoder and memory tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_model.py tests/test_train.py tests/test_long_context.py tests/test_hierarchical_retrieval.py tests/test_notebook_integrity.py
