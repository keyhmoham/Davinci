name: Davinci model tests

on:
  push:
    paths:
      - "src/davinci/**"
      - "configs/**"
      - "notebooks/**"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/model-tests.yml"
  pull_request:
    paths:
      - "src/davinci/**"
      - "configs/**"
      - "notebooks/**"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/model-tests.yml"

jobs:
  model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -r requirements-test.txt
      - name: Run repository regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
