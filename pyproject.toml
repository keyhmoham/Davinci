[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-research"
version = "0.1.0"
description = "Persian-first bilingual language-model research implementation"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<3",
]

[project.optional-dependencies]
server = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.34.0",
  "sentencepiece>=0.2,<0.3",
]
notebooks = [
  "sentencepiece>=0.2,<0.3",
  "datasets>=3,<4",
  "huggingface_hub>=0.25,<1",
  "pandas>=2.2,<3",
  "tqdm>=4.66,<5",
]
test = [
  "pytest==8.3.5",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "numpy==1.26.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]